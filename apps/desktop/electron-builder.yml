# electron-builder configuration: `npm run dist` (root) builds unsigned installers for the
# current OS into apps/desktop/release/. CI builds the other OSes on their own runners.
appId: io.github.oldpeasant.thicket
productName: Thicket
copyright: Copyright © Thicket contributors
directories:
  buildResources: build
  output: release

# main, preload and backend are esbuild bundles (scripts/build.mjs): only `electron` stays
# external, so the workspace packages need not be copied. Native modules added later must be
# marked external in build.mjs and listed in `dependencies`; electron-builder then rebuilds them
# for Electron's ABI (npmRebuild) and unpacks *.node files from the asar.
files:
  - dist/**/*
  - '!dist/**/*.map'
  - package.json
asarUnpack:
  - '**/*.node'
npmRebuild: true
# The built Angular app (npm run build -w packages/renderer), read by main from resources/renderer.
extraResources:
  - from: ../../packages/renderer/dist
    to: renderer
    filter:
      - '**/*'

artifactName: thicket-${version}-${os}-${arch}.${ext}

# Electron fuses (@electron/fuses, flipped in the packaged binary before signing): the shipped
# executable cannot be turned into a plain Node runtime (ELECTRON_RUN_AS_NODE, NODE_OPTIONS,
# --inspect) and only runs the app.asar next to it. The backend runs in a utilityProcess, which
# needs none of these. Asar integrity validation works on macOS and Windows (electron-builder
# writes the hash into Info.plist / the exe resources); Linux ignores that fuse. With
# --inspect off, Playwright's Electron driver cannot attach to a packaged build: the smoke test
# (scripts/smoke-packaged.mjs) uses the Chromium DevTools protocol of the renderer instead.
# Residual risk (accepted): no fuse controls Chromium's --remote-debugging-port, so the packaged
# app still accepts it. Anyone able to launch the binary with arguments can attach over CDP and
# drive the renderer (including the preload's thicket.request against saved connections).
# Refusing it in packaged builds is a possible follow-up, not part of this hardening.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true

linux:
  target: [AppImage, deb, rpm]
  category: Development
  executableName: thicket
  # WM_CLASS / Wayland app id matches thicket.desktop (package.json desktopName).
  syncDesktopName: true
  synopsis: Desktop client for MongoDB
  description: Thicket is a desktop client for MongoDB.
  icon: build/icon.png
  maintainer: Thicket contributors <thicket@users.noreply.github.com>
  vendor: Thicket contributors
deb:
  packageName: thicket
rpm:
  packageName: thicket

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  icon: build/icon.png
  # No Developer ID yet (SPEC: signing and notarization later). '-' = ad-hoc signing
  # (app-builder-lib 26.18 MacTargetHelper.findSigningIdentity): electron-builder modifies the
  # Electron bundle, and an unsigned modified bundle is reported as "damaged" on Apple Silicon;
  # ad-hoc signed, users get the normal unidentified-developer Gatekeeper warning instead.
  # `null` would skip signing entirely. Ad-hoc signing needs hardenedRuntime off (library
  # validation would reject Electron's frameworks).
  identity: '-'
  hardenedRuntime: false
dmg:
  sign: false

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.png
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
