name: check

# Runs the same project check as TFP's `.taskcheck` (npm run check) on every push and PR,
# on Linux, macOS and Windows, with the Node major pinned in .nvmrc.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # Never cancel runs on main: each finished task pushed there keeps its own CI result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        # Git for Windows' bash on windows-latest, like TFP runs .taskcheck in sh.
        shell: bash
    steps:
      # Windows runners default to core.autocrlf=true; Prettier (endOfLine: lf) would then
      # reject every file. Check out with LF line endings on all OSes.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check (.taskcheck)
        run: bash .taskcheck

  # The packaged app with native addons compiled. Optional addons (ssh2's sshcrypto,
  # os-dns-native, ...) are built by `npm ci` only where a C/C++ toolchain exists: the runners
  # have one, agents' machines usually don't. Release v0.1.0-rc.1 failed in esbuild because of
  # them. The vetted optional ones are now left out (apps/desktop/src/build/native-addons.ts) and
  # any other addon fails the build there; this job builds and smoke-tests with them compiled on
  # every push.
  bundle:
    name: bundle (ubuntu-latest, native addons)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Fails if the toolchain went missing: the job would then no longer test what it is for.
      - name: Native addons are compiled
        run: |
          ls -l node_modules/ssh2/lib/protocol/crypto/build/Release/sshcrypto.node \
            node_modules/os-dns-native/build/Release/os_dns_native.node

      # Renderer, esbuild bundles and the unpacked app (release/linux-unpacked), as `npm run dist`
      # builds them but without the installers.
      - name: Build app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:dir -w apps/desktop

      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs
      # (as in release.yml).
      - name: Allow user namespaces for the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Starts the packaged app (headless): renderer, main and the backend (which loads ssh2)
      # must answer.
      - name: Smoke test packaged app
        working-directory: apps/desktop
        run: node scripts/smoke-packaged.mjs release/linux-unpacked/thicket release/smoke.png
