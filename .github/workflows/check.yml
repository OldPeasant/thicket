name: check

# Runs the same project check as TFP's `.taskcheck` (npm run check) on every push and PR,
# on Linux, macOS and Windows, with the Node major pinned in .nvmrc.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        # Git for Windows' bash on windows-latest, like TFP runs .taskcheck in sh.
        shell: bash
    steps:
      # Windows runners default to core.autocrlf=true; Prettier (endOfLine: lf) would then
      # reject every file. Check out with LF line endings on all OSes.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check (.taskcheck)
        run: bash .taskcheck
