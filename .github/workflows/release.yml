name: release

# On a `v*` tag: build installers on each OS (electron-builder, apps/desktop/electron-builder.yml)
# and upload them with SHA-256 checksums to a draft GitHub release. A human reviews and publishes it.
# Windows is signed through SignPath when the SIGNPATH_API_TOKEN secret and the
# SIGNPATH_ORGANIZATION_ID variable exist (docs/CODE_SIGNING.md), unsigned otherwise.
# The other builds are unsigned (macOS: ad-hoc).
#   Linux x64 + arm64: AppImage, deb, rpm
#   macOS:             dmg (arm64 + x64, both built on one Apple Silicon runner)
#   Windows x64:       NSIS installer + portable zip
# Each build job then smoke-tests its installer (npm run test:smoke, test/e2e/smoke).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            args: --linux --x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            args: --linux --arm64
          - name: mac
            os: macos-latest
            # Arches come from electron-builder.yml (mac.target: dmg, arm64 + x64).
            args: --mac
          - name: win-x64
            os: windows-latest
            args: --win --x64
            # Signing waits for up to two manual SignPath approvals (app, then installer).
            timeout: 150
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 45 }}
    # Job-level permissions replace the workflow-level block. actions: read lets the SignPath
    # action read the uploaded artifact (and the run details) through the job token.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # rpmbuild for the rpm target (deb and AppImage need nothing extra); xvfb for the smoke test.
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb

      - name: Install
        run: npm ci

      # Windows signing (docs/CODE_SIGNING.md) runs only when the SignPath secret and variable
      # exist; otherwise this logs a notice and Windows builds unsigned exactly as before.
      - name: Check Windows signing setup
        id: signing
        if: runner.os == 'Windows'
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: node apps/desktop/scripts/signpath-enabled.mjs

      # The version comes from the tag (v1.2.3 -> 1.2.3), the package.json files stay at 0.0.0.
      # --publish never: electron-builder must not publish on its own; the release job does.
      # With signing, Windows first builds only the unpacked app (--dir, release/win-unpacked);
      # the installer and zip are made from the signed folder below.
      - name: Build installers
        env:
          TAG: ${{ github.ref_name }}
          ARGS: ${{ matrix.args }}
          SIGN: ${{ steps.signing.outputs.enabled }}
          # electron-builder never signs itself (macOS: ad-hoc, electron-builder.yml; Windows:
          # SignPath below); keep it from looking for certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          version="${TAG#v}"
          dir=()
          if [ "$SIGN" = true ]; then dir=(--dir); fi
          # shellcheck disable=SC2086 # ARGS holds several flags
          npm run dist -w apps/desktop -- $ARGS "${dir[@]}" "-c.extraMetadata.version=$version"

      # SignPath signs Thicket.exe in the uploaded folder (artifact configuration `win-app`) and
      # returns the folder; origin verification ties the request to this workflow run.
      - name: Upload unsigned app for signing
        id: unsigned-app
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-${{ matrix.name }}
          path: apps/desktop/release/win-unpacked
          if-no-files-found: error
          retention-days: 1

      - name: Sign app (SignPath)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: thicket
          signing-policy-slug: release-signing
          artifact-configuration-slug: win-app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing needs a manual approval in SignPath (docs/CODE_SIGNING.md).
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/release/win-signed

      # --prepackaged: package the signed folder as is (no repacking, no fuse or resource edits),
      # so the zip and the app inside the installer hold the signed Thicket.exe. Same file names.
      # electron-builder only (not `npm run dist`): the renderer and bundles are already in the app.
      - name: Build installer and zip from the signed app
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/desktop
        env:
          TAG: ${{ github.ref_name }}
          ARGS: ${{ matrix.args }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          version="${TAG#v}"
          # shellcheck disable=SC2086 # ARGS holds several flags
          npx electron-builder --config electron-builder.yml --publish never $ARGS \
            --prepackaged release/win-signed "-c.extraMetadata.version=$version"

      - name: Upload unsigned installer for signing
        id: unsigned-installer
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ matrix.name }}
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer (SignPath)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: thicket
          signing-policy-slug: release-signing
          artifact-configuration-slug: win-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/release/installer-signed

      # Replace the unsigned installer by the signed one (same name); the checksums in the
      # release job are computed from these files, so after signing.
      - name: Use signed installer
        if: steps.signing.outputs.enabled == 'true'
        run: |
          shopt -s nullglob
          signed=(apps/desktop/release/installer-signed/*.exe)
          if [ "${#signed[@]}" -ne 1 ]; then
            echo "expected one signed installer, found: ${signed[*]}" >&2
            exit 1
          fi
          name="$(basename "${signed[0]}")"
          if [ ! -f "apps/desktop/release/$name" ]; then
            echo "signed installer $name does not replace an unsigned one" >&2
            exit 1
          fi
          cp -- "${signed[0]}" "apps/desktop/release/$name"

      - name: Collect installers
        run: |
          mkdir -p out
          shopt -s nullglob
          files=(apps/desktop/release/*.{AppImage,deb,rpm,dmg,exe,zip})
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no installers found in apps/desktop/release" >&2
            ls -la apps/desktop/release >&2 || true
            exit 1
          fi
          cp "${files[@]}" out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

      # Ubuntu 24.04 restricts unprivileged user namespaces (AppArmor), which Chromium's sandbox
      # needs; the AppImage can't ship a setuid chrome-sandbox. Allow them rather than starting
      # the app with --no-sandbox, so the smoke test runs the app as users do.
      - name: Allow user namespaces for the Chromium sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Smoke test (test/e2e/smoke): start the packaged app from its installer with Playwright,
      # the welcome screen shows; on Linux it also connects to a MongoDB container (Docker).
      # A failure fails the job, so no draft release is made from broken installers.
      - name: Smoke test installer
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          shopt -s nullglob
          case "$RUNNER_OS_NAME" in
            Linux) files=(out/*.AppImage) ;;
            # macos-latest is Apple Silicon: test the arm64 dmg (the x64 one would run under Rosetta).
            macOS) files=(out/*-arm64.dmg) ;;
            # The NSIS installer; the portable zip holds the same app.
            Windows) files=(out/*.exe) ;;
          esac
          if [ "${#files[@]}" -ne 1 ]; then
            echo "expected one installer to smoke-test, found: ${files[*]}" >&2
            exit 1
          fi
          export THICKET_SMOKE_INSTALLER="${files[0]}"
          if [ "$RUNNER_OS_NAME" = Linux ]; then
            # No FUSE on the runner: the AppImage runtime extracts itself instead of mounting.
            export APPIMAGE_EXTRACT_AND_RUN=1
            export THICKET_SMOKE_MONGO=1
            xvfb-run -a npm run test:smoke
          else
            npm run test:smoke
          fi

      - name: Upload smoke test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ matrix.name }}
          path: test-results/smoke
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          path: out
          merge-multiple: true

      # After signing: the Windows files in the artifacts are the signed ones.
      - name: Checksums
        working-directory: out
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Creates the draft release for the tag, or adds to it when the workflow is re-run.
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: out
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Thicket $TAG" --generate-notes
          fi
          gh release upload "$TAG" --clobber -- *
